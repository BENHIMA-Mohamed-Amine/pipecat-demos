[project]
name = "pipecat-demos"
version = "0.1.0"
description = "my pipecat-demos repo for different use cases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.0",
    "langchain>=1.2.10",
    "langchain-nvidia-ai-endpoints>=1.1.0",
    "pipecat-ai[nvidia,silero,webrtc]>=0.0.104",

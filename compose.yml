services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_ENDPOINT=/api/offer
    container_name: pipecat-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: pipecat-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    networks:
      - app-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant-server
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - app-network

volumes:
  qdrant_data:

networks:
  app-network:
    driver: bridge